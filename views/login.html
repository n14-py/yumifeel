<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar - YumiFeel</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#fbf3ec">
</head>
<body style="justify-content: center; align-items: center; padding: 20px;">

    <div class="glass-panel" style="width: 100%; max-width: 380px; padding: 40px 30px; text-align: center; animation: msgPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);">
        
        <div style="font-size: 3.5rem; margin-bottom: 10px; animation: floatYumi 3s infinite ease-in-out;">
            🐰
        </div>
        
        <h1 class="brand-logo" style="font-size: 2rem; margin-bottom: 5px;">YumiFeel</h1>
        <p style="color: var(--secondary); margin-bottom: 30px; font-size: 0.95rem;">Conecta tu corazón</p>

        <% if (locals.error) { %>
            <div style="background: rgba(174, 116, 116, 0.1); color: var(--danger); padding: 12px; border-radius: 15px; margin-bottom: 20px; font-size: 0.9rem; border: 1px solid var(--danger);">
                <i class="fas fa-exclamation-circle"></i> <%= error %>
            </div>
        <% } %>

        <form action="/login" method="POST">
            
            <div style="position: relative; margin-bottom: 15px;">
                <i class="fas fa-envelope" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--secondary); opacity: 0.6;"></i>
                <input type="email" name="email" placeholder="Tu correo electrónico" required 
                       style="width: 100%; padding: 16px 16px 16px 45px; border-radius: 20px; border: 1px solid white; background: rgba(255,255,255,0.6); outline: none; color: var(--text-main); font-size: 1rem; transition: all 0.3s;">
            </div>

            <div style="position: relative; margin-bottom: 25px;">
                <i class="fas fa-lock" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--secondary); opacity: 0.6;"></i>
                <input type="password" name="password" placeholder="Tu contraseña" required 
                       style="width: 100%; padding: 16px 16px 16px 45px; border-radius: 20px; border: 1px solid white; background: rgba(255,255,255,0.6); outline: none; color: var(--text-main); font-size: 1rem; transition: all 0.3s;">
            </div>

            <button type="submit" style="width: 100%; padding: 16px; border-radius: 50px; background: linear-gradient(135deg, var(--text-main), var(--secondary)); color: white; font-weight: 800; border: none; cursor: pointer; font-size: 1.1rem; box-shadow: 0 8px 20px rgba(81, 52, 43, 0.25); transition: transform 0.2s;">
                Entrar ✨
            </button>

        </form>

        <div style="margin-top: 30px; font-size: 0.9rem; color: var(--secondary);">
            ¿Aún no tienes cuenta? <br>
            <a href="/register" style="color: var(--primary); font-weight: 800; text-decoration: none; border-bottom: 2px solid var(--highlight);">
                Crear cuenta nueva
            </a>
        </div>

    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>

</body>
</html>
